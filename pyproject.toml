[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "donderformer"
version = "0.1.0"
description = "Transformer-based Taiko no Tatsujin chart generation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "torch",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]
